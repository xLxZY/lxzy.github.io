<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — LxZY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; background-color: #F5F0EB; }
  body { font-family: 'Inter', sans-serif; background-color: #F5F0EB; color: #2A2826; line-height: 1.6; overflow-x: hidden; }
  a { text-decoration: none; }
  button { cursor: pointer; font-family: 'Inter', sans-serif; }
  h1, h2, h3, h4 { font-family: 'Sora', sans-serif; font-weight: 600; letter-spacing: -0.02em; }

  /* NAV */
  #nav {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 1.2rem 2rem; z-index: 1000;
    background: rgba(245, 240, 235, 0.7);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    transition: all 0.3s;
  }
  #nav.scrolled { background: rgba(245, 240, 235, 0.95); border-bottom: 1px solid rgba(0, 0, 0, 0.08); }
  .nav-inner {
    max-width: 1440px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* LOGO — matches index.html */
  .nav-logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    transition: opacity 0.3s;
    overflow: visible;
  }
  .nav-logo img {
    height: 36px;
    width: 36px;
    display: block;
    object-fit: contain;
    transform: scale(1.9);
    transform-origin: left center;
  }
  .nav-logo:hover { opacity: 0.7; }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #5A5450; transition: color 0.3s; }
  .nav-links a:hover, .nav-links a.active { color: #B87C5A; }
  .nav-cta { background: #2A2826 !important; color: #F5F0EB !important; padding: 0.4rem 1.2rem !important; border-radius: 0px !important; transition: all 0.3s !important; }
  .nav-cta:hover { background: #B87C5A !important; transform: translateY(-2px); }
  .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; }
  .hamburger span { width: 22px; height: 1.5px; background: #2A2826; }
  .mobile-nav { display: none; position: fixed; top: 70px; left: 0; width: 100%; background: #F5F0EB; padding: 1.5rem; flex-direction: column; gap: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 999; }
  .mobile-nav.open { display: flex; }
  .mobile-nav a { font-size: 1.1rem; font-weight: 500; color: #2A2826; }

  /* PAGE HERO */
  .page-hero { padding: 9rem 2rem 5rem; background: #E8E2DC; margin-bottom: 4rem; text-align: center; }
  .page-hero-inner { max-width: 800px; margin: 0 auto; }
  .page-hero .label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: #9B8B7A; margin-bottom: 1rem; }
  .page-hero h1 { font-size: clamp(3rem, 8vw, 5rem); font-weight: 700; color: #2A2826; margin-bottom: 1rem; }
  .page-hero p { font-size: 1.1rem; color: #6A6360; max-width: 500px; margin: 0 auto; }

  /* MAIN WRAP */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
  .page { padding-top: 0; padding-bottom: 5rem; }
  @media (max-width: 768px) { .wrap { padding: 0 1.2rem; } }

  /* TAG BAR */
  .tag-bar { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 3rem; justify-content: center; }
  .tag-btn { padding: 0.4rem 1rem; background: #E8E2DC; border: none; font-size: 0.8rem; font-weight: 500; color: #5A5450; transition: all 0.2s; cursor: pointer; font-family: 'Inter', sans-serif; }
  .tag-btn:hover, .tag-btn.active { background: #2A2826; color: #F5F0EB; }

  /* POST LISTING */
  #listing { display: flex; flex-direction: column; gap: 2rem; }
  .post-card { border-bottom: 1px solid #E2DDD8; padding: 2rem 0; display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: start; cursor: pointer; transition: all 0.3s; }
  .post-card:hover { padding-left: 1rem; border-bottom-color: #B87C5A; }
  .post-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
  .post-tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; background: #E8E2DC; padding: 0.2rem 0.6rem; color: #5A5450; }
  .post-title { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.5rem; color: #2A2826; }
  .post-summary { font-size: 0.9rem; color: #6A6360; line-height: 1.5; }
  .post-meta { text-align: right; }
  .post-date { font-size: 0.75rem; color: #9B8B7A; white-space: nowrap; }
  .post-read { font-size: 0.7rem; color: #9B8B7A; margin-top: 0.2rem; }
  .post-arrow { margin-top: 0.8rem; display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: #B87C5A; transition: gap 0.2s; }
  .post-card:hover .post-arrow { gap: 0.6rem; }

  /* SINGLE POST */
  #singleView { max-width: 800px; margin: 0 auto; }
  .back-btn { position: sticky; top: 90px; z-index: 10; background: #F5F0EB; border: 1px solid #D9D2CB; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 500; color: #B87C5A; margin-bottom: 2rem; margin-left: -10rem; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .back-btn:hover { background: #B87C5A; color: #F5F0EB; border-color: #B87C5A; gap: 0.8rem; }
  .back-btn svg { width: 14px; stroke: currentColor; stroke-width: 2; }
  .post-header-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  .post-header-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; margin-bottom: 1rem; line-height: 1.2; }
  .post-header-meta { font-size: 0.8rem; color: #9B8B7A; display: flex; gap: 1rem; margin-bottom: 2rem; }
  .post-divider { height: 1px; background: #E2DDD8; margin: 2rem 0; }
  .post-body { font-size: 1rem; line-height: 1.7; color: #3A3836; }
  .post-body h1, .post-body h2, .post-body h3 { margin-top: 2rem; margin-bottom: 1rem; }
  .post-body p { margin-bottom: 1.2rem; }
  .post-body a { color: #B87C5A; text-decoration: underline; }
  .post-body blockquote { border-left: 3px solid #B87C5A; padding-left: 1rem; margin: 1.5rem 0; font-style: italic; color: #5A5450; }
  .post-body code { background: #E8E2DC; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .post-body pre { background: #2A2826; color: #F5F0EB; padding: 1rem; overflow-x: auto; margin: 1.5rem 0; }
  .post-body pre code { background: none; color: inherit; }
  .post-body img { max-width: 100%; margin: 1.5rem 0; border-radius: 0; }
  .post-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: #E8E2DC; }
  .post-body th, .post-body td { border: 1px solid #CBC3BC; padding: 0.5rem; text-align: left; }
  .post-body th { background: #D9D2CB; font-weight: 600; }

  /* FOOTER */
  footer { background: #E8E2DC; padding: 2rem; text-align: center; font-size: 0.7rem; color: #9B8B7A; margin-top: 4rem; }
  .footer-inner { max-width: 1200px; margin: 0 auto; }

  /* LOADING, REVEAL */
  .loading { text-align: center; padding: 3rem; color: #9B8B7A; }
  .spinner { width: 30px; height: 30px; border: 2px solid #E2DDD8; border-top-color: #B87C5A; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .post-card { grid-template-columns: 1fr; gap: 1rem; }
    .post-meta { text-align: left; }
    .page-hero { padding: 6rem 1rem 3rem; }
    .back-btn { top: 80px; }
  }
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.webp" alt="LxZY" width="128" height="128" loading="eager" decoding="sync" fetchpriority="high">
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Portfolio</a></li>
      <li><a href="index.html#whoami">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
      <li><a href="index.html#contact" class="nav-cta">Let's Connect</a></li>
    </ul>
    <button class="hamburger" id="hamburger">☰</button>
  </div>
</nav>
<nav class="mobile-nav" id="mobileNav">
  <a href="index.html">Portfolio</a>
  <a href="index.html#whoami">About</a>
  <a href="index.html#projects">Projects</a>
  <a href="blog.html">Blog</a>
  <a href="index.html#contact">Let's Connect</a>
</nav>

<header class="page-hero" id="pageHero">
  <div class="page-hero-inner">
    <p class="label">Hi, Welcome To the Playground</p>
    <h1>The Blog</h1>
    <p>Security research, lab write-ups, and thoughts from the SOC trenches.</p>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div id="listingView">
      <div class="tag-bar" id="tagBar"></div>
      <div id="listing"><div class="loading"><div class="spinner"></div><span>Loading posts…</span></div></div>
    </div>
    <div id="singleView" style="display:none;">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        All Posts
      </button>
      <article>
        <header class="post-header">
          <div class="post-header-tags" id="singleTags"></div>
          <h1 class="post-header-title" id="singleTitle"></h1>
          <div class="post-header-meta"><span id="singleDate"></span><span id="singleReadTime"></span></div>
        </header>
        <div class="post-divider"></div>
        <div class="post-body" id="singleBody"></div>
      </article>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">© 2026 LxZY. All rights reserved.</div>
</footer>

<script>
  let allPosts = [];
  let activeTag = 'All';

  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
  });
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('mobileNav').classList.toggle('open');
  });
  function closeMobile() { document.getElementById('mobileNav').classList.remove('open'); }

  function getSlug() { const hash = location.hash.slice(1); return hash && hash !== '/' ? hash : null; }
  function navigate(slug) {
    if (slug) { history.pushState(null, '', '#' + slug); renderPost(slug); }
    else { history.pushState(null, '', location.pathname); renderListing(); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.addEventListener('popstate', () => { const slug = getSlug(); slug ? renderPost(slug) : renderListing(); });

  async function loadPosts() {
    try {
      const r = await fetch('posts.json?v=' + Date.now());
      if (!r.ok) throw new Error();
      allPosts = await r.json();
      allPosts.sort((a,b) => new Date(b.date) - new Date(a.date));
      init();
    } catch(e) {
      document.getElementById('listing').innerHTML = '<div class="loading">⚠️ Could not load posts.</div>';
    }
  }
  function init() { const slug = getSlug(); slug ? renderPost(slug) : (buildTagBar(), renderListing()); }
  function buildTagBar() {
    const tags = ['All', ...new Set(allPosts.flatMap(p => p.tags))];
    document.getElementById('tagBar').innerHTML = tags.map(t => `<button class="tag-btn${t === activeTag ? ' active' : ''}" onclick="filterTag('${t}')">${t}</button>`).join('');
  }
  function filterTag(tag) { activeTag = tag; buildTagBar(); renderListing(); }
  function renderListing() {
    document.getElementById('listingView').style.display = '';
    document.getElementById('singleView').style.display = 'none';
    document.getElementById('pageHero').style.display = '';
    const filtered = activeTag === 'All' ? allPosts : allPosts.filter(p => p.tags.includes(activeTag));
    const container = document.getElementById('listing');
    if (!filtered.length) { container.innerHTML = '<div class="loading">No posts found.</div>'; return; }
    container.innerHTML = filtered.map((p,i) => `
      <div class="post-card reveal" style="transition-delay:${i*0.05}s" onclick="navigate('${p.id}')">
        <div>
          <div class="post-tags">${p.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}</div>
          <div class="post-title">${p.title}</div>
          <div class="post-summary">${p.summary}</div>
        </div>
        <div class="post-meta">
          <div class="post-date">${formatDate(p.date)}</div>
          <div class="post-read">${readTime(p.content)} min read</div>
          <div class="post-arrow">Read →</div>
        </div>
      </div>
    `).join('');
    requestAnimationFrame(() => {
      document.querySelectorAll('.reveal').forEach((el,i) => setTimeout(() => el.classList.add('in'), i*50));
    });
  }
  function renderPost(slug) {
    const post = allPosts.find(p => p.id === slug);
    if (!post) { navigate(null); return; }
    document.getElementById('listingView').style.display = 'none';
    document.getElementById('pageHero').style.display = 'none';
    document.getElementById('singleView').style.display = '';
    document.title = post.title + ' — LxZY';
    document.getElementById('singleTags').innerHTML = post.tags.map(t => `<span class="post-tag">${t}</span>`).join('');
    document.getElementById('singleTitle').textContent = post.title;
    document.getElementById('singleDate').textContent = formatDate(post.date);
    document.getElementById('singleReadTime').textContent = readTime(post.content) + ' min read';
    document.getElementById('singleBody').innerHTML = marked.parse(post.content);
  }
  document.getElementById('backBtn').addEventListener('click', () => { document.title = 'Blog — LxZY'; navigate(null); });
  function formatDate(iso) { return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }); }
  function readTime(content) { return Math.max(1, Math.ceil(content.split(/\s+/).length / 200)); }
  loadPosts();
</script>
</body>
</html>
