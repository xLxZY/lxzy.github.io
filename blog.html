<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — LxZy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
/* ---------- RESET + DARK EDITORIAL ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  background: #01010a;
}
body {
  font-family: 'Outfit', sans-serif;
  background: #01010a;
  color: #f0f0fa;
  line-height: 1.6;
  overflow-x: hidden;
}
a {
  text-decoration: none;
}
button {
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
}
img {
  display: block;
  max-width: 100%;
}

/* ---------- TYPOGRAPHY ---------- */
h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #a89eff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.label::before {
  content: '';
  width: 32px;
  height: 2px;
  background: #a89eff;
}

/* ---------- NAV ---------- */
#nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 80px;
  z-index: 1000;
  background: rgba(1, 1, 10, 0.75);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(168, 158, 255, 0.15);
  transition: 0.3s;
}
#nav.scrolled {
  background: rgba(1, 1, 10, 0.95);
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
}
.nav-inner {
  max-width: 1600px;
  margin: 0 auto;
  height: 100%;
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 2rem;
  background: linear-gradient(135deg, #fff, #bfb5ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}
.nav-links a {
  font-size: 0.8rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #ddddf5;
  transition: 0.2s;
  padding-bottom: 4px;
  border-bottom: 1.5px solid transparent;
}
.nav-links a:hover, .nav-links a.active {
  color: white;
  border-bottom-color: #a89eff;
}
.nav-cta {
  background: #a89eff !important;
  color: #01010a !important;
  padding: 8px 20px !important;
  border-radius: 40px !important;
  font-weight: 700 !important;
}
.nav-cta:hover {
  background: #c5bbff !important;
  transform: translateY(-2px);
}
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
}
.hamburger span {
  width: 24px;
  height: 2px;
  background: white;
}
.mobile-nav {
  display: none;
  position: fixed;
  top: 80px;
  left: 0;
  right: 0;
  background: rgba(1,1,10,0.97);
  backdrop-filter: blur(24px);
  padding: 2rem;
  flex-direction: column;
  gap: 1.2rem;
  z-index: 999;
  border-bottom: 1px solid rgba(168,158,255,0.2);
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-size: 1.2rem;
  font-weight: 600;
  color: white;
}

/* ---------- PAGE HERO (cinematic) ---------- */
.page-hero {
  position: relative;
  padding: 8rem 0 6rem;
  margin-bottom: 5rem;
  overflow: hidden;
  background: radial-gradient(ellipse at 70% 20%, #15102e, #01010a);
}
.page-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 20% 40%, rgba(168,158,255,0.08) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}
.page-hero::after {
  content: 'BLOG';
  font-family: 'Bebas Neue', cursive;
  font-size: 18vw;
  position: absolute;
  bottom: -5vw;
  right: -2vw;
  color: rgba(168,158,255,0.04);
  pointer-events: none;
  line-height: 1;
  letter-spacing: 0.06em;
}
.page-hero-inner {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem; /* increased horizontal padding */
}
.page-hero .label {
  margin-bottom: 1.5rem;
  color: #b8adff;
}
.page-hero h1 {
  font-size: clamp(3rem, 10vw, 6rem);
  font-weight: 800;
  color: white;
  letter-spacing: -0.02em;
  margin-bottom: 1.2rem;
}
.page-hero p {
  font-size: 1.2rem;
  color: #b0b0e0;
  max-width: 550px;
}

/* ---------- TAG BAR (better spacing) ---------- */
.tag-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin-bottom: 4rem;
  padding: 0 0.2rem;
}
.tag-btn {
  padding: 0.6rem 1.4rem;
  border-radius: 60px;
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(20, 20, 40, 0.7);
  border: 1px solid rgba(168,158,255,0.2);
  color: #cdcdf5;
  transition: all 0.25s;
  cursor: pointer;
  backdrop-filter: blur(4px);
  white-space: nowrap;
}
.tag-btn:hover, .tag-btn.active {
  background: #a89eff;
  border-color: #a89eff;
  color: #01010a;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(168,158,255,0.2);
}
/* allow tags to wrap on small screens */
@media (max-width: 640px) {
  .tag-btn {
    white-space: normal;
    font-size: 0.75rem;
    padding: 0.4rem 1rem;
  }
}

/* ---------- MAIN CONTAINER (generous padding) ---------- */
.wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem; /* increased from 1.5rem to 2rem for breathing room */
}
@media (max-width: 768px) {
  .wrap {
    padding: 0 1.5rem;
  }
}
.page {
  padding-top: calc(var(--nav-h, 80px) + 60px);
  padding-bottom: 120px;
}

/* ---------- LISTING (editorial cards) ---------- */
#listing {
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}
.post-card {
  background: rgba(12, 12, 24, 0.6);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(168,158,255,0.1);
  border-radius: 2rem;
  padding: 2.5rem 2.8rem;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2rem;
  align-items: start;
  transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  cursor: pointer;
}
.post-card:hover {
  border-color: #a89eff;
  transform: translateY(-6px);
  background: rgba(20, 18, 40, 0.8);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.post-tag {
  padding: 0.2rem 0.8rem;
  background: rgba(168,158,255,0.15);
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #cdbeff;
}
.post-title {
  font-size: clamp(1.4rem, 2.5vw, 2rem);
  font-weight: 800;
  margin-bottom: 0.8rem;
  line-height: 1.2;
  color: white;
}
.post-summary {
  font-size: 0.95rem;
  color: #b7b7e8;
  line-height: 1.65;
}
.post-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.6rem;
}
.post-date {
  font-size: 0.8rem;
  font-weight: 500;
  color: #a89eff;
  white-space: nowrap;
}
.post-read {
  font-size: 0.7rem;
  color: #7f7fb0;
}
.post-arrow {
  width: 44px;
  height: 44px;
  background: rgba(168,158,255,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.25s;
}
.post-card:hover .post-arrow {
  background: #a89eff;
  transform: translateX(6px);
}
.post-arrow svg {
  width: 20px;
  stroke: #a89eff;
}
.post-card:hover .post-arrow svg {
  stroke: #01010a;
}

/* ---------- SINGLE POST (spacious, centered) ---------- */
#singleView {
  animation: fadeIn 0.6s ease;
}
.post-header {
  margin-bottom: 3rem;
  padding: 0 0.5rem;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(168,158,255,0.1);
  border: 1px solid rgba(168,158,255,0.3);
  padding: 0.6rem 1.4rem;
  border-radius: 60px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #cdbeff;
  margin-bottom: 2.5rem;
  transition: 0.2s;
}
.back-btn:hover {
  background: #a89eff;
  color: #01010a;
  transform: translateX(-5px);
}
.post-header-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}
.post-header-title {
  font-size: clamp(2rem, 6vw, 4.2rem);
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: 1.2rem;
  color: white;
}
.post-header-meta {
  display: flex;
  gap: 1.5rem;
  font-size: 0.9rem;
  color: #a8a8da;
  flex-wrap: wrap;
}
.post-divider {
  height: 1px;
  background: rgba(168,158,255,0.2);
  margin: 2.5rem 0;
}

/* ---------- MARKDOWN CONTENT (centered + generous padding) ---------- */
.post-body {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 1rem; /* added internal padding for extra breathing */
  font-size: 1.05rem;
  line-height: 1.75;
  color: #e3e3f5;
}
.post-body h1 {
  font-size: 2.5rem;
  margin: 2rem 0 1rem;
  font-weight: 800;
}
.post-body h2 {
  font-size: 2rem;
  margin: 1.8rem 0 1rem;
  font-weight: 700;
}
.post-body h3 {
  font-size: 1.5rem;
  margin: 1.5rem 0 0.8rem;
  font-weight: 700;
}
.post-body p {
  margin-bottom: 1.5rem;
}
.post-body a {
  color: #cbb9ff;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.post-body ul, .post-body ol {
  margin: 1rem 0 1.5rem 2rem;
}
.post-body li {
  margin-bottom: 0.4rem;
}
.post-body blockquote {
  border-left: 4px solid #a89eff;
  background: rgba(168,158,255,0.05);
  padding: 1rem 1.5rem;
  margin: 2rem 0;
  font-style: italic;
  color: #d0d0ff;
}
.post-body code {
  background: rgba(168,158,255,0.15);
  padding: 0.2rem 0.4rem;
  border-radius: 6px;
  font-size: 0.9em;
  font-family: monospace;
}
.post-body pre {
  background: #0a0a14;
  border-radius: 1.2rem;
  padding: 1.5rem;
  overflow-x: auto;
  margin: 2rem 0;
}
.post-body pre code {
  background: transparent;
  padding: 0;
  color: #cbd5e1;
}
.post-body img {
  border-radius: 1.2rem;
  margin: 2rem auto;
  display: block;
  max-width: 100%;
  height: auto;
  box-shadow: 0 20px 30px -10px black;
}
/* Tables */
.post-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 2rem 0;
  font-size: 0.9rem;
  background: rgba(10, 10, 20, 0.6);
  border-radius: 1rem;
  overflow: hidden;
}
.post-body th,
.post-body td {
  border: 1px solid rgba(168, 158, 255, 0.25);
  padding: 0.8rem 1rem;
  text-align: left;
  vertical-align: top;
}
.post-body th {
  background: rgba(168, 158, 255, 0.15);
  font-weight: 700;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 0.8rem;
}
.post-body td {
  background: rgba(15, 15, 28, 0.7);
  color: #e0e0f0;
}
.post-body tr:hover td {
  background: rgba(168, 158, 255, 0.08);
}
.post-body table p {
  margin: 0;
}
/* responsive tables */
@media (max-width: 768px) {
  .post-body table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
  .post-body {
    padding: 0 0.5rem;
  }
}

/* ---------- FOOTER ---------- */
footer {
  background: #01010a;
  border-top: 1px solid rgba(168,158,255,0.1);
  padding: 2rem 2rem;
  margin-top: 5rem;
}
.footer-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.footer-logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem;
  background: linear-gradient(135deg, #fff, #bfb5ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.footer-copy {
  font-size: 0.75rem;
  color: #5a5a8a;
}

/* ---------- UTILITIES ---------- */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}
.loading {
  display: flex;
  justify-content: center;
  padding: 5rem;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(168,158,255,0.2);
  border-top-color: #a89eff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- RESPONSIVE (extra spacing adjustments) ---------- */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .post-card { grid-template-columns: 1fr; padding: 1.8rem; }
  .post-meta { flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
  .page-hero { padding: 5rem 0 3rem; }
  .page-hero-inner { padding: 0 1.5rem; }
  .wrap { padding: 0 1.2rem; }
  .post-header { padding: 0; }
}
@media (min-width: 1400px) {
  .wrap {
    padding: 0 2.5rem;
  }
  .post-body {
    max-width: 960px;
  }
}
</style>
</head>
<body>

<!-- NAV (unchanged structure) -->
<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">LxZy</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Portfolio</a></li>
      <li><a href="index.html#whoami">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>

    </ul>

      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
<nav class="mobile-nav" id="mobileNav">
  <a href="index.html" onclick="closeMobile()">Portfolio</a>
  <a href="index.html#whoami" onclick="closeMobile()">About</a>
  <a href="index.html#projects" onclick="closeMobile()">Projects</a>
  <a href="blog.html" onclick="closeMobile()">Blog</a>
  <a href="index.html#contact" onclick="closeMobile()">Let's Connect</a>
</nav>

<header class="page-hero" id="pageHero">
  <div class="wrap page-hero-inner">
    <p class="label">Hi, Welcome To the Playground</p>
    <h1>The Blog</h1>
    <p>Security research, lab write-ups, and thoughts from the SOC trenches.</p>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div id="listingView">
      <div class="tag-bar" id="tagBar"></div>
      <div id="listing"><div class="loading"><div class="spinner"></div><span>Loading posts…</span></div></div>
    </div>

      <button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24" stroke-width="2" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg> All Posts</button>

          <div class="post-header-tags" id="singleTags"></div>

        </header>
        <div class="post-divider"></div>
        <div class="post-body" id="singleBody"></div>
      </article>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-logo">LxZy</span>
    <span class="footer-copy">© 2026 Karim — All rights reserved.</span>
  </div>
</footer>

<script>
// ═══════════════════════════════════════════════════════
// ALL ORIGINAL JAVASCRIPT LOGIC — PRESERVED EXACTLY
// ═══════════════════════════════════════════════════════
let allPosts = [];
let activeTag = 'All';

window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});

document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.toggle('open');
});
function closeMobile() { document.getElementById('mobileNav').classList.remove('open'); }

function getSlug() {
  const hash = location.hash.slice(1);
  return hash && hash !== '/' ? hash : null;
}

function navigate(slug) {
  if (slug) {
    history.pushState(null, '', '#' + slug);
    renderPost(slug);
  } else {
    history.pushState(null, '', location.pathname);
    renderListing();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('popstate', () => {
  const slug = getSlug();
  slug ? renderPost(slug) : renderListing();
});

async function loadPosts() {
  try {
    const r = await fetch('posts.json?v=' + Date.now());
    if (!r.ok) throw new Error('Failed to load');
    allPosts = await r.json();
    allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
    init();
  } catch (e) {
    document.getElementById('listing').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>Could not load, Please Reload the Webpage :)</p></div>';
  }
}

function init() {
  const slug = getSlug();
  if (slug) {
    renderPost(slug);
  } else {
    buildTagBar();
    renderListing();
  }
}

function buildTagBar() {
  const tags = ['All', ...new Set(allPosts.flatMap(p => p.tags))];
  const bar = document.getElementById('tagBar');
  bar.innerHTML = tags.map(t =>
    `<button class="tag-btn${t === activeTag ? ' active' : ''}" onclick="filterTag('${t}')">${t}</button>`
  ).join('');
}

function filterTag(tag) {
  activeTag = tag;
  buildTagBar();
  renderListing();
}

function renderListing() {
  document.getElementById('listingView').style.display = '';
  document.getElementById('singleView').style.display = 'none';
  document.getElementById('pageHero').style.display = '';

  const filtered = activeTag === 'All' ? allPosts : allPosts.filter(p => p.tags.includes(activeTag));
  const container = document.getElementById('listing');

  if (!filtered.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No posts yet. Check back soon.</p></div>';
    return;
  }

  container.innerHTML = filtered.map((p, i) => `
    <div class="post-card reveal" style="transition-delay:${i * 0.07}s" onclick="navigate('${p.id}')">
      <div>
        <div class="post-tags">${p.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}</div>
        <div class="post-title">${p.title}</div>
        <div class="post-summary">${p.summary}</div>
      </div>
      <div class="post-meta">
        <span class="post-date">${formatDate(p.date)}</span>
        <span class="post-read">${readTime(p.content)} min read</span>
        <div class="post-arrow">
          <svg viewBox="0 0 24 24" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>
    </div>
  `).join('');

  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), i * 60);
    });
  });
}

function renderPost(slug) {
  const post = allPosts.find(p => p.id === slug);
  if (!post) { navigate(null); return; }

  document.getElementById('listingView').style.display = 'none';
  document.getElementById('pageHero').style.display = 'none';
  document.getElementById('singleView').style.display = '';

  document.title = post.title + ' — LxZy';
  document.getElementById('singleTags').innerHTML = post.tags.map(t => `<span class="post-tag">${t}</span>`).join('');
  document.getElementById('singleTitle').textContent = post.title;
  document.getElementById('singleDate').textContent = formatDate(post.date);
  document.getElementById('singleReadTime').textContent = readTime(post.content) + ' min read';
  document.getElementById('singleBody').innerHTML = marked.parse(post.content);
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.title = 'Blog — LxZy';
  navigate(null);
});
