<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin — LxZY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: #F5F0EB;
    color: #2A2826;
    line-height: 1.5;
  }
  button {
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  input, textarea, select {
    font-family: 'Inter', sans-serif;
    background: #FFFFFF;
    border: 1px solid #CBC3BC;
    padding: 0.7rem 1rem;
    font-size: 0.9rem;
    width: 100%;
    border-radius: 0;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #B87C5A;
  }
  label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: #5A5450;
    display: block;
    margin-bottom: 0.3rem;
  }

  /* Screens */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* Login & Config */
  #loginScreen, #configScreen {
    align-items: center;
    justify-content: center;
    background: #E8E2DC;
  }
  .login-card, .config-card {
    background: #F5F0EB;
    padding: 2rem;
    max-width: 450px;
    width: 90%;
    border: 1px solid #D9D2CB;
  }
  .login-logo {
    font-family: 'Sora', sans-serif;
    font-size: 2rem;
    font-weight: 600;
    color: #2A2826;
  }
  .login-title {
    font-size: 1.4rem;
    margin: 0.5rem 0 0.2rem;
  }
  .field {
    margin-bottom: 1rem;
  }
  .btn-primary {
    background: #2A2826;
    color: #F5F0EB;
    border: none;
    padding: 0.7rem;
    font-weight: 600;
    width: 100%;
    transition: background 0.2s;
  }
  .btn-primary:hover {
    background: #B87C5A;
  }
  .login-error {
    background: #E8E2DC;
    color: #B87C5A;
    padding: 0.5rem;
    margin-bottom: 1rem;
    display: none;
  }
  .hash-display {
    background: #FFFFFF;
    padding: 0.5rem;
    font-family: monospace;
    font-size: 0.8rem;
    word-break: break-all;
    margin-top: 0.3rem;
  }
  .btn-ghost {
    background: none;
    border: 1px solid #CBC3BC;
    padding: 0.5rem;
    width: 100%;
  }

  /* Dashboard */
  #dashScreen {
    flex-direction: column;
  }
  .topbar {
    background: #F5F0EB;
    border-bottom: 1px solid #E2DDD8;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .topbar-logo {
    font-family: 'Sora', sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
  }
  .topbar-actions {
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .status-dot.ok { background: #6B8C6B; }
  .status-dot.err { background: #B87C5A; }
  .status-dot.idle { background: #CBC3BC; }
  .topbar-btn {
    background: none;
    border: 1px solid #CBC3BC;
    padding: 0.3rem 0.8rem;
    font-size: 0.7rem;
    text-decoration: none;
    color: #2A2826;
  }
  .topbar-btn.primary {
    background: #2A2826;
    color: #F5F0EB;
    border: none;
  }
  .dashboard-body {
    display: flex;
    height: calc(100vh - 70px);
    overflow: hidden;
  }
  /* Sidebar */
  .sidebar {
    width: 280px;
    background: #E8E2DC;
    border-right: 1px solid #D9D2CB;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 1rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
  }
  .new-post-btn {
    margin: 1rem;
    background: #2A2826;
    color: #F5F0EB;
    border: none;
    padding: 0.5rem;
    font-weight: 600;
  }
  .post-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }
  .post-item {
    padding: 0.5rem;
    margin-bottom: 0.3rem;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .post-item:hover {
    background: #D9D2CB;
  }
  .post-item.active {
    background: #FFFFFF;
    border-color: #B87C5A;
  }
  .post-item-title {
    font-weight: 600;
    font-size: 0.9rem;
  }
  /* Editor */
  .editor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .editor-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9B8B7A;
  }
  .editor-toolbar {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid #E2DDD8;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .editor-tabs {
    display: flex;
    gap: 0.2rem;
  }
  .editor-tab {
    background: none;
    border: 1px solid #CBC3BC;
    padding: 0.3rem 0.8rem;
    font-size: 0.7rem;
  }
  .editor-tab.active {
    background: #2A2826;
    color: #F5F0EB;
    border-color: #2A2826;
  }
  .img-upload-btn {
    background: none;
    border: 1px solid #CBC3BC;
    padding: 0.3rem 0.8rem;
  }
  .editor-panes {
    flex: 1;
    display: grid;
    overflow: hidden;
  }
  .editor-panes.split {
    grid-template-columns: 1fr 1fr;
  }
  .fields-pane {
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  #contentArea {
    min-height: 300px;
    font-family: monospace;
    resize: vertical;
  }
  .preview-pane {
    padding: 1rem;
    overflow-y: auto;
    background: #FFFFFF;
    border-left: 1px solid #E2DDD8;
  }
  .preview-pane h1, .preview-pane h2 {
    margin-top: 1rem;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #F5F0EB;
    padding: 1.5rem;
    max-width: 400px;
    border: 1px solid #D9D2CB;
  }
  .toast-wrap {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 300;
  }
  .toast {
    background: #2A2826;
    color: #F5F0EB;
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
  }
  .spin {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #F5F0EB;
    border-top-color: #B87C5A;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="screen" id="configScreen">
  <div class="config-card">
    <h2>⚙️ First-Time Setup</h2>
    <p>Generate your password hash and update admin.html</p>
    <div class="field"><label>Choose a Password</label><input type="password" id="setupPassword"></div>
    <div class="field"><label>SHA-256 Hash</label><div class="hash-display" id="hashDisplay">Type a password above…</div></div>
    <div class="field"><button class="btn-ghost" onclick="showScreen('loginScreen')">← Back</button> <button class="btn-primary" onclick="copyHash()">Copy Hash</button></div>
  </div>
</div>

<div class="screen active" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">LxZY</div>
    <div class="login-title">Blog Admin</div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>Admin Password</label><input type="password" id="passwordInput"></div>
    <div class="field"><label>GitHub Token</label><input type="password" id="tokenInput"><p style="font-size:0.7rem; margin-top:0.2rem;">Fine-grained token with Contents: Read & Write</p></div>
    <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    <div style="margin-top:1rem;"><a onclick="showScreen('configScreen')" style="cursor:pointer;">First time? Generate hash</a></div>
  </div>
</div>

<div class="screen" id="dashScreen">
  <div class="topbar">
    <span class="topbar-logo">LxZY</span>
    <div class="topbar-actions">
      <div class="status-dot idle" id="statusDot"></div>
      <a href="blog.html" target="_blank" class="topbar-btn">View Blog</a>
      <button class="topbar-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="dashboard-body">
    <aside class="sidebar">
      <div class="sidebar-header"><span>POSTS</span><span id="postCount">0</span></div>
      <button class="new-post-btn" onclick="newPost()">+ New Post</button>
      <div class="post-list" id="postList"></div>
    </aside>
    <div class="editor-area" id="editorArea">
      <div class="editor-placeholder" id="editorPlaceholder">
        <div>✍️ No post selected</div>
      </div>
      <div id="editorPanel" style="display:none; flex-direction:column; flex:1;">
        <div class="editor-toolbar">
          <div class="editor-tabs">
            <button class="editor-tab active" onclick="switchTab('write')">Write</button>
            <button class="editor-tab" onclick="switchTab('split')">Split</button>
            <button class="editor-tab" onclick="switchTab('preview')">Preview</button>
          </div>
          <button class="img-upload-btn" onclick="document.getElementById('imgFileInput').click()">Insert Image</button>
          <input type="file" id="imgFileInput" accept="image/*" onchange="uploadImage(this)" style="display:none">
          <button class="topbar-btn" onclick="confirmDelete()">🗑 Delete</button>
          <button class="topbar-btn primary" onclick="savePost()"><span id="saveBtnLabel">💾 Publish</span></button>
        </div>
        <div class="editor-panes" id="editorPanes">
          <div class="editor-pane" id="fieldsPane">
            <div class="fields-pane">
              <div class="field"><label>Title *</label><input type="text" id="titleInput" oninput="autoSlug()"></div>
              <div class="field"><label>Slug (URL ID) *</label><input type="text" id="slugInput" oninput="slugInput.value = slugify(slugInput.value)"></div>
              <div class="field"><label>Date</label><input type="date" id="dateInput"></div>
              <div class="field"><label>Tags (comma-separated)</label><input type="text" id="tagsInput"></div>
              <div class="field"><label>Summary</label><textarea id="summaryInput" rows="3"></textarea></div>
              <div class="field"><label>Content (Markdown)</label><textarea id="contentArea" rows="12" oninput="onContentChange()"></textarea><div id="charCount">0 words</div></div>
            </div>
          </div>
          <div class="editor-pane preview-pane" id="previewPane" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal"><div class="modal"><h3>Delete Post?</h3><p id="deleteTitle"></p><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="doDelete()">Yes, Delete</button></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
  // ════════════════════════════════════════════
  // CONFIG — EDIT THESE VALUES BEFORE DEPLOY
  // ════════════════════════════════════════════
  const CONFIG = {
    REPO_OWNER:    'xLazyass',   // ← change this
    REPO_NAME:     'lxzy.github.io',         // ← change this
    BRANCH:        'main',
    POSTS_PATH:    'posts.json',
    PASSWORD_HASH: 'f4105da046af9ba7495b257eae71f246869e7ee47614fe5c3e37a105fda3b1fe'  // ← paste your hash here
  };
  // ════════════════════════════════════════════

  let githubToken = '';
  let posts       = [];
  let activeId    = null;
  let isNew       = false;
  let activeTab   = 'write';

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  document.getElementById('setupPassword').addEventListener('input', async (e) => {
    const val = e.target.value;
    if (!val) { document.getElementById('hashDisplay').textContent = 'Type a password above…'; return; }
    document.getElementById('hashDisplay').textContent = await sha256(val);
  });
  async function copyHash() {
    const hash = document.getElementById('hashDisplay').textContent;
    if (hash.length < 60) { toast('Enter a password first', 'error'); return; }
    await navigator.clipboard.writeText(hash);
    toast('Hash copied!', 'success');
  }
  async function doLogin() {
    const pw    = document.getElementById('passwordInput').value.trim();
    const token = document.getElementById('tokenInput').value.trim();
    const err   = document.getElementById('loginError');
    err.classList.remove('show');
    if (!pw || !token) { err.textContent = 'Both fields required.'; err.classList.add('show'); return; }
    const hash = await sha256(pw);
    if (hash !== CONFIG.PASSWORD_HASH) { err.textContent = 'Incorrect password.'; err.classList.add('show'); return; }
    githubToken = token;
    showScreen('dashScreen');
    loadPosts();
  }
  function logout() { githubToken = ''; posts = []; activeId = null; renderSidebar(); resetEditor(); showScreen('loginScreen'); }
  const API = `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${CONFIG.POSTS_PATH}`;
  async function ghGet() {
    const r = await fetch(API + `?ref=${CONFIG.BRANCH}`, { headers: { Authorization: `Bearer ${githubToken}` } });
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    return r.json();
  }
  async function ghPut(content, sha, message) {
    const r = await fetch(API, { method: 'PUT', headers: { Authorization: `Bearer ${githubToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha, branch: CONFIG.BRANCH }) });
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    return r.json();
  }
  async function loadPosts() {
    setStatus('idle');
    try {
      const file = await ghGet();
      const json = decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))));
      posts = JSON.parse(json);
      posts.sort((a,b) => new Date(b.date) - new Date(a.date));
      renderSidebar();
      setStatus('ok');
      toast(`Loaded ${posts.length} posts`, 'info');
    } catch (e) { setStatus('err'); toast('Failed to load posts: ' + e.message, 'error'); }
  }
  async function savePosts(message) {
    setStatus('idle');
    const file = await ghGet();
    const content = JSON.stringify(posts, null, 2);
    await ghPut(content, file.sha, message);
    setStatus('ok');
  }
  function renderSidebar() {
    document.getElementById('postCount').textContent = posts.length;
    const list = document.getElementById('postList');
    if (!posts.length) { list.innerHTML = '<div style="padding:1rem; text-align:center;">No posts yet.</div>'; return; }
    list.innerHTML = posts.map(p => `<div class="post-item ${p.id === activeId ? 'active' : ''}" onclick="selectPost('${p.id}')"><div class="post-item-title">${escapeHtml(p.title)}</div><div style="font-size:0.7rem;">${formatDate(p.date)}</div></div>`).join('');
  }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function selectPost(id) {
    activeId = id; isNew = false;
    const post = posts.find(p => p.id === id); if (!post) return;
    renderSidebar(); showEditor();
    document.getElementById('titleInput').value = post.title;
    document.getElementById('slugInput').value = post.id;
    document.getElementById('dateInput').value = post.date;
    document.getElementById('tagsInput').value = post.tags.join(', ');
    document.getElementById('summaryInput').value = post.summary;
    document.getElementById('contentArea').value = post.content;
    updateWordCount();
    if (activeTab !== 'write') updatePreview();
  }
  function newPost() {
    activeId = null; isNew = true;
    renderSidebar(); showEditor();
    document.getElementById('titleInput').value = '';
    document.getElementById('slugInput').value = '';
    document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
    document.getElementById('tagsInput').value = '';
    document.getElementById('summaryInput').value = '';
    document.getElementById('contentArea').value = '';
    updateWordCount();
  }
  function showEditor() {
    document.getElementById('editorPlaceholder').style.display = 'none';
    document.getElementById('editorPanel').style.display = 'flex';
  }
  function resetEditor() {
    document.getElementById('editorPlaceholder').style.display = '';
    document.getElementById('editorPanel').style.display = 'none';
    activeId = null; isNew = false;
  }
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.editor-tab').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase() === tab));
    const panes = document.getElementById('editorPanes');
    const fields = document.getElementById('fieldsPane');
    const preview = document.getElementById('previewPane');
    if (tab === 'write') { panes.classList.remove('split'); fields.style.display = ''; preview.style.display = 'none'; }
    if (tab === 'preview') { panes.classList.remove('split'); fields.style.display = 'none'; preview.style.display = ''; updatePreview(); }
    if (tab === 'split') { panes.classList.add('split'); fields.style.display = ''; preview.style.display = ''; updatePreview(); }
  }
  function onContentChange() { updateWordCount(); if (activeTab !== 'write') updatePreview(); }
  function updatePreview() { if (typeof marked !== 'undefined') document.getElementById('previewPane').innerHTML = marked.parse(document.getElementById('contentArea').value || '*Nothing to preview.*'); else { const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js'; s.onload=updatePreview; document.head.appendChild(s); } }
  function updateWordCount() { const words = (document.getElementById('contentArea').value.match(/\S+/g) || []).length; document.getElementById('charCount').textContent = words + ' word' + (words !== 1 ? 's' : ''); }
  function slugify(str) { return str.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/[\s_]+/g,'-').replace(/^-+|-+$/g,''); }
  function autoSlug() { if (isNew) document.getElementById('slugInput').value = slugify(document.getElementById('titleInput').value); }
  async function savePost() {
    const title = document.getElementById('titleInput').value.trim();
    const slug = document.getElementById('slugInput').value.trim();
    const date = document.getElementById('dateInput').value;
    const tags = document.getElementById('tagsInput').value.split(',').map(t=>t.trim()).filter(Boolean);
    const summary = document.getElementById('summaryInput').value.trim();
    const content = document.getElementById('contentArea').value.trim();
    if (!title || !slug || !content) { toast('Title, Slug and Content are required.', 'error'); return; }
    const duplicate = posts.find(p => p.id === slug && p.id !== activeId);
    if (duplicate) { toast('Slug already in use.', 'error'); return; }
    const post = { id: slug, title, date, tags, summary, content };
    if (isNew) { posts.unshift(post); activeId = slug; isNew = false; } else {
      const idx = posts.findIndex(p => p.id === activeId);
      if (idx === -1) { toast('Post not found.', 'error'); return; }
      if (slug !== activeId) posts.splice(idx, 1, post), activeId = slug;
      else posts[idx] = post;
    }
    const label = document.getElementById('saveBtnLabel');
    label.innerHTML = '<span class="spin"></span>';
    try {
      await savePosts(`blog: ${isNew ? 'add' : 'update'} "${title}"`);
      toast('Published!', 'success');
      renderSidebar();
    } catch (e) { toast('Save failed: ' + e.message, 'error'); if (isNew) posts.shift(); }
    finally { label.innerHTML = '💾 Publish'; }
  }
  function confirmDelete() { const post = posts.find(p => p.id === activeId); if (!post) return; document.getElementById('deleteTitle').textContent = post.title; document.getElementById('deleteModal').classList.add('show'); }
  function closeModal() { document.getElementById('deleteModal').classList.remove('show'); }
  async function doDelete() {
    closeModal(); const idx = posts.findIndex(p => p.id === activeId); if (idx === -1) return;
    const title = posts[idx].title; posts.splice(idx, 1);
    try { await savePosts(`blog: delete "${title}"`); toast('Post deleted.', 'info'); resetEditor(); renderSidebar(); } catch (e) { toast('Delete failed: ' + e.message, 'error'); posts.splice(idx, 0, posts[idx]); renderSidebar(); }
  }
  function setStatus(state) { const dot = document.getElementById('statusDot'); dot.className = 'status-dot ' + state; }
  function toast(msg, type) { const wrap = document.getElementById('toastWrap'); const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = msg; wrap.appendChild(el); setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3500); }
  async function uploadImage(input) {
    const file = input.files[0]; if (!file) return; input.value = '';
    toast('Uploading image...', 'info');
    try {
      const base64 = await new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file);});
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase();
      const path = `images/${Date.now()}-${safeName}`;
      const apiUrl = `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/${path}`;
      let sha;
      try { const check = await fetch(apiUrl, { headers: { Authorization: `Bearer ${githubToken}` } }); if (check.ok) { const d = await check.json(); sha = d.sha; } } catch(_) {}
      const body = { message: `blog: add image ${safeName}`, content: base64, branch: CONFIG.BRANCH }; if (sha) body.sha = sha;
      const res = await fetch(apiUrl, { method: 'PUT', headers: { Authorization: `Bearer ${githubToken}`, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`Upload failed: ${res.status}`);
      const textarea = document.getElementById('contentArea');
      const mdSnippet = `\n![${file.name}](${path})\n`;
      const start = textarea.selectionStart, end = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, start) + mdSnippet + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + mdSnippet.length;
      textarea.focus(); onContentChange();
      toast('Image uploaded!', 'success');
    } catch(e) { toast('Upload failed: ' + e.message, 'error'); }
  }
  function formatDate(iso) { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
</script>
